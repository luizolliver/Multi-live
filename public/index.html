<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Live | Transamazonica ao Vivo</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <h1>Multi-Live</h1>
    <div id="controls">
      <select id="event-selector">
        <option value="">Selecione um evento...</option>
      </select>
      <div id="layout-buttons">
        <button data-layout="grid-2x2" class="active" title="Grade 2x2 + 1">2x2 + 1</button>
        <button data-layout="main-plus-4" title="Principal + 4 secundarios">1 + 4</button>
        <button data-layout="grid-3x2" title="Grade 3x2">3x2</button>
      </div>
    </div>
  </header>

  <main id="player-container" class="layout-grid-2x2">
    <div id="empty-state">
      <h2>Bem-vindo ao Multi-Live</h2>
      <p>Selecione um evento acima para assistir as lives.</p>
    </div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/js/app.js"></script>
</body>
</html>
